# Copy to config.toml (or just open Settings in the app, which writes config.toml for you).
# Project Tracker configuration, edited from the app's Settings page.
# Secrets are not here: they live in the login Keychain (service "TaskTracker") or the environment.

[general]
host = "127.0.0.1"
port = 8791
timezone = ""
work_start = "10:30"
work_end = "15:30"
default_estimate_minutes = 30
min_block_minutes = 10
replan_drift_minutes = 20
overrun_minutes = 30
replan_min_interval_minutes = 10
meeting_alert_minutes = 45

[snapshots]
enable = true
time = "05:00"
dir = ""

[llm]
model = "claude-opus-5-5"
effort = "high"
quick_add_effort = "medium"
enable = true

[toggl]
tag = ""
project = ""             # used when nothing else decides
auto_project = true
check_minutes = 5         # how often to ask Toggl whether you stopped the running timer there
routine_projects = []     # "Anki review: Personal": the Toggl project for each routine (Settings fills it in with Claude once)

[linear]
enable = false
sync_minutes = 10
category_name = "Linear"
group_by = "project"

[calendar]
ics_urls = []            # your calendar's "Secret address in iCal format" (Settings > Calendar)
ignore_titles = []
busy_only = true

[sheets]
apps_script_url = ""      # /exec URL of apps_script/Code.gs deployed on your checklist sheet
exercise_script_url = ""  # /exec URL of the exercise log's export script
daily_checklist_csv = ""
exercise_csv = ""
cache_minutes = 30
prefetch_time = "23:50"   # sheets and calendar are read afresh here, before the internet goes off at night

[exercise]
rotation = []
after_done = "zone 2 cardio"   # offered at the bottom of the feed once the day's session is done

[reading]
routine = "Reading books or papers"   # the daily reading row; its feed card suggests the highest-priority reading task
minutes = 30
fallback = "Read a book"
tag = "reading"           # Toggl tag on every reading timer

[writing]
routine = "Writing - 40 minutes"   # the daily writing row; its card suggests the highest-priority writing task
minutes = 40
fallback = "Free writing"
tag = "writing"           # Toggl tag on timers for tasks that are mainly writing

[focus_monitor]
enable = true
min_minutes = 60          # the feed prompts "review your focus monitor" every 60-120 minutes of the work day
max_minutes = 120
item = "Review Focus Monitor"   # the checklist row ticked on the first review of the day
notify = true

[journal]
app = "Roam Research"
desktop = 1

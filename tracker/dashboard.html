<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Tracker</title>
<style>
:root{--box:#fff;--box2:#f3f5f8;--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent-ink:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#eef2ff;--chip-ink:#3730a3;--hover:#f1f5f9;--done:#dcfce7}
@media (prefers-color-scheme:dark){:root{--box:#171a21;--box2:#0f1115;--bg:#0f1115;--card:#171a21;--ink:#e6e8ec;--muted:#9aa3b2;--line:#2a2f3a;--accent:#60a5fa;--accent-ink:#0b1220;--chip:#1e2740;--chip-ink:#c7d2fe;--hover:#1e2330;--done:#1d4d2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
body{display:flex;min-height:100vh}
#side{width:190px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
#side .brand{font-weight:700;padding:4px 10px 12px;font-size:15px}
#side nav{display:flex;flex-direction:column;gap:2px}
#side nav button{background:none;border:0;text-align:left;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;cursor:pointer;font-size:15px;display:flex;gap:8px;align-items:center}
#side nav button .ic{width:16px;display:inline-block;text-align:center;font-size:12px}
#side nav button:hover{background:var(--hover)}
#side nav button.on{background:var(--chip);color:var(--chip-ink)}
#timer{margin-top:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
body.nosidebar #side{display:none}
#sideToggle{font-size:18px;line-height:1;padding:4px 9px;color:var(--muted)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center}
#quick{flex:1;display:flex;gap:6px}
#quick input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
@media (max-width:640px){body{flex-direction:column}#side{width:auto;height:auto;position:static;flex-direction:row;align-items:center}#side nav{flex-direction:row}#side .brand{display:none}#timer{margin:0 0 0 auto;border:0;padding:0}}
main{max-width:1100px;margin:0 auto;padding:16px;width:100%}
button{font:inherit;cursor:pointer}
.btn{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.small{padding:3px 8px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.snaps{display:flex;gap:16px;align-items:flex-start}
.snaps .dates{flex:0 0 150px;display:flex;flex-direction:column;gap:2px;max-height:80vh;overflow:auto}
.snaps .dates button{background:none;border:0;text-align:left;padding:6px 10px;border-radius:8px;color:var(--muted);cursor:pointer;font:inherit}
.snaps .dates button:hover{background:var(--hover)}.snaps .dates button.on{background:var(--chip);color:var(--chip-ink);font-weight:600}
.snaps .snap{flex:1;min-width:0;white-space:pre-wrap;line-height:1.5;font-size:14px}
.snaps .snap .md-h1{display:block;margin-bottom:8px}.snaps .snap .md-h2{display:block;margin-top:12px}
.muted{color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--chip);color:var(--chip-ink);margin-right:4px;white-space:nowrap}
.chip.bad{background:#fee2e2;color:#991b1b}.chip.warn{background:#fef3c7;color:#92400e}.chip.ok{background:#dcfce7;color:#166534}
@media (prefers-color-scheme:dark){.chip.bad{background:#3b1111;color:#fca5a5}.chip.warn{background:#3a2a07;color:#fcd34d}.chip.ok{background:#0f2e1a;color:#86efac}}
.dots{letter-spacing:1px;font-size:11px}
/* projects */
.proj{margin:8px 0 8px 22px;border:1px solid var(--line);border-radius:3px;padding:4px 8px 6px;background:var(--box)}
.proj.root{margin:12px 0 14px}
.proj .proj{background:var(--box2)}.proj .proj .proj{background:var(--box)}.proj .proj .proj .proj{background:var(--box2)}
.children:empty{display:none}
.phead{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px}
.phead:hover{background:var(--hover)}
.phead:focus{outline:none;background:var(--hover);box-shadow:inset 2px 0 0 var(--accent)}
.phead h3 .name{cursor:text}
.phead h3{margin:0;font-size:16px;flex:1;cursor:default}
.proj.root>.phead h3{font-size:19px}
.phead .tools{display:flex;gap:4px;opacity:.25}
.phead:hover .tools{opacity:1}
.handle{cursor:grab;color:var(--muted);user-select:none;padding:0 4px}
.task{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:8px;margin-left:0}
.task:hover{background:var(--hover)}
.task:focus{outline:none;background:var(--hover);box-shadow:inset 2px 0 0 var(--accent)}
.task.sel,.phead.sel{background:var(--hover);box-shadow:inset 2px 0 0 var(--accent)}
.tasks{padding:2px 0 6px 22px;min-height:10px;cursor:text}
.tasks.sub{margin:0;padding:0 0 0 26px;min-height:0}
.tasks.sub:empty{display:none}
.task.dragging,.tasks.dragging,.proj.dragging{opacity:.35}
textarea.inline{display:block;width:100%;padding:2px 4px;margin:0;border:0;border-bottom:1px solid var(--accent);background:transparent;color:var(--ink);font:inherit;line-height:inherit;outline:none;resize:none;overflow:hidden;min-height:1.45em}
.caret{cursor:pointer;color:var(--muted);width:14px;text-align:center;font-size:12px}
.task .notes{margin:6px 0 2px;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:3px;white-space:pre-wrap;font-size:14px;cursor:text;min-height:20px;line-height:1.45;color:var(--ink)}
.task .notes .more{margin-top:6px;font-size:12px;color:var(--muted)}
.task .notes .more a{color:var(--muted);cursor:pointer;text-decoration:none}.task .notes .more a:hover{color:var(--ink)}
.task .notes textarea{width:100%;min-height:90px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.tasks.sub.collapsed{display:none}
.task>.caret{margin-top:4px}
.pdetails{margin:4px 0 14px;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:4px}
.pdetails h2{margin:0 0 4px;font-size:22px;cursor:text}
.pdetails .notes{margin-top:10px;white-space:pre-wrap;font-size:14px;cursor:text;min-height:20px;line-height:1.45}
.pdetails textarea{width:100%;min-height:120px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.hint{color:var(--muted);opacity:.6;padding:24px 10px;cursor:text;pointer-events:none}
.tasks.zoomroot{min-height:60px;padding-bottom:24px}
#tree{min-height:120px;padding-bottom:40px}
.crumb{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a{cursor:pointer;color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--ink)}
.task input[type=checkbox]{margin-top:4px;width:16px;height:16px}
.task .body{flex:1;min-width:0}
.task .body{cursor:default}
.task .title{cursor:text}
.multi #tree .task,.multi #tree .phead,.multi #tree .task .title,.multi #tree .task .body,.multi #tree .phead .name,.multi #tree .tasks{cursor:pointer}
.md-h1{font-size:29px;font-weight:700;line-height:1.25}.md-h2{font-size:20px;font-weight:700;line-height:1.3}.md-h3{font-size:17px;font-weight:650}
.md-h4{font-size:15px;font-weight:650}.md-h5{font-size:14px;font-weight:650}.md-h6{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
/* heading hashes beat the default root / nested header sizes above */
.proj>.phead h3.md-h1{font-size:29px}.proj>.phead h3.md-h2{font-size:20px}.proj>.phead h3.md-h3{font-size:17px}.proj>.phead h3.md-h4{font-size:15px}.proj>.phead h3.md-h5{font-size:14px}.proj>.phead h3.md-h6{font-size:13px}
.pdetails h2.md-h1{font-size:28px}.pdetails h2.md-h2{font-size:24px}.pdetails h2.md-h3{font-size:20px}.pdetails h2.md-h4,.pdetails h2.md-h5,.pdetails h2.md-h6{font-size:17px}
code{font-size:.9em;padding:1px 4px;border-radius:3px;background:var(--hover)}
.tag{color:var(--muted)}
.proj.editing>.phead:hover{background:transparent}
.task .title.lin::after{content:" ↗";color:var(--muted);font-size:12px}
.task .meta{font-size:12px;color:var(--muted);margin-top:2px}
.task .desc{margin:6px 0 2px;white-space:pre-wrap;font-size:14px;border-left:2px solid var(--line);padding-left:8px}
.task .tools{display:flex;gap:2px;opacity:.25}
.task:hover .tools{opacity:1}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.proj.archived>.phead h3{color:var(--muted);font-style:italic}
.filters{display:flex;gap:14px;align-items:center;font-size:14px}
.filterwrap{position:relative}
.filterwrap .filters{position:absolute;right:0;top:calc(100% - 1px);margin:0;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;border-top-right-radius:0;box-shadow:0 6px 18px rgba(0,0,0,.08);z-index:5;white-space:nowrap}
.ctx{position:fixed;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;min-width:180px}
.ctx button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:6px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.ctx button:hover{background:var(--hover)}.ctx button.danger{color:#b91c1c}.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.bulkbar{position:fixed;z-index:15;display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.12);font-size:13px}
.bulkbar input{width:320px;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--box);color:var(--ink)}
.btn.ghost.on{background:var(--card);color:var(--ink);border-color:var(--line);border-bottom-color:var(--card);border-bottom-left-radius:0;border-bottom-right-radius:0;position:relative;z-index:6}
.filters label{display:flex;gap:5px;align-items:center;cursor:pointer}
.dropzone{height:4px}
.dropzone.over{height:4px;background:var(--accent);border-radius:2px}
a{color:var(--accent)}
/* feed: one centered card, like a tear-off calendar page */
.feed{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px}
/* the line above the deck: the next meeting, once it is close */
.feed .upcoming{min-height:26px;font-size:15px;color:var(--accent);font-weight:600;margin-bottom:6px}
.page{width:min(900px,100%);min-height:min(640px,calc(100vh - 150px));background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px 0 28px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;flex-direction:column}
.page .main{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;padding:8px 0}
/* completing a card: it flashes green, then slides off to the right; the next card slides in */
@keyframes cardDone{0%{transform:none;opacity:1}25%,55%{background:var(--done);border-color:#16a34a;transform:none;opacity:1}100%{background:var(--done);border-color:#16a34a;transform:translateX(140%) rotate(3deg);opacity:0}}
.page.done{animation:cardDone .95s cubic-bezier(.55,0,.9,.4) forwards;pointer-events:none}
.stack{position:relative;width:min(900px,100%)}
@media (prefers-reduced-motion:reduce){.page.done{animation:none;opacity:.4}}
.page .date{background:var(--ink);color:var(--bg);padding:10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-radius:5px 5px 0 0}
.page .kind{margin-top:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-height:18px}
.page .path{color:var(--muted);font-size:14px;margin-top:10px}
.page .big{font-size:40px;font-weight:700;line-height:1.2;margin:14px 40px 0}
.page .tags{margin:4px 0 8px}
.page .meta{font-size:13px;color:var(--muted);margin:0 28px}
.page .desc{text-align:left;white-space:pre-wrap;margin:16px 36px 4px;font-size:14px;color:var(--ink);max-height:220px;overflow:auto;border-top:1px solid var(--line);padding-top:12px}
.page .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 20px 0}
.page .actions{gap:16px;margin-top:0}
.page .actions .btn{padding:14px 36px;font-size:18px;min-width:200px;justify-content:center;border-radius:10px}
.page .actions input[type=checkbox]{width:18px;height:18px}
.page .alts{margin:32px 48px 0;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn.alt{background:#ea7a1a;color:#fff;border-color:#ea7a1a;padding:6px 14px;font-size:13px}
.btn.alt:hover{background:#d66c10}
.btn.alt:disabled{opacity:.45}
.page .clist{display:inline-block;text-align:left;margin:14px auto 0}
.page .clist label{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:15px}
.page .kbd{font-size:12px;color:var(--muted);margin-top:10px}
.page .more{margin-top:18px}
.page .more button{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}
.page .details{margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.page .clist{margin-bottom:18px}
.feed .foot{font-size:12px;color:var(--muted);display:flex;gap:12px;align-items:center}
.feed .foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px}
.meeting{font-size:13px;color:var(--muted)}
.timeline li{display:grid;grid-template-columns:110px 90px 1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center}
.timeline li.done{opacity:.55;text-decoration:line-through}
.timeline li.skipped{opacity:.4}
.timeline li.active{background:var(--chip)}
.timeline .k{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:20}
.modal .card{width:min(640px,94vw);max-height:90vh;overflow:auto}
.form{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;align-items:center}
.form input,.form select,.form textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.form textarea{min-height:110px}
.form .full{grid-column:1/-1}
.settings .card{margin-bottom:14px}.settings h3{margin:0 0 10px}.settings h3 .chip{margin-left:8px;font-weight:500;vertical-align:middle}
.settings .form{grid-template-columns:170px 1fr}.settings .form label{font-size:14px}.settings .form .help{grid-column:2;font-size:12px;color:var(--muted);margin:-4px 0 2px}
.settings .form input[type=checkbox]{width:auto;justify-self:start}
.settings .keyrow{display:flex;gap:8px;align-items:center}.settings .keyrow input{flex:1}
.settings .savebar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:10px;align-items:center;justify-content:flex-end}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:90vw;display:none;z-index:30}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.kbd{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<aside id="side">
  <div class="brand">Task Tracker</div>
  <nav>
    <button data-view="projects">Projects</button>
    <button data-view="feed">Feed</button>
    <button data-view="stats">Stats</button>
    <button data-view="snapshots">Snapshots</button>
    <button data-view="settings">Settings</button>
  </nav>
  <div id="timer"></div>
</aside>
<div id="content">
<header>
  <button id="sideToggle" class="btn ghost" title="Show or hide the sidebar (⌘\\)" onclick="toggleSidebar()">≡</button>
  <form id="quick" onsubmit="return quickAdd(event)">
    <input id="quickText" placeholder="Quick add… (Claude files it in the right project)  ⌘K" autocomplete="off">
    <button class="btn primary" type="submit">Add</button>
  </form>
</header>
<main id="main"></main>
</div>
<div id="toast"></div>

<script>
// ------------------------------------------------------------------ utils
const $ = s => document.querySelector(s);
const api = async (path, method = 'GET', body) => {
  const r = await fetch('/api' + path, {method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
// Markdown, the useful subset. Text is escaped first; the raw source shows only while a line is being edited.
const mdInline = s => esc(s)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[^"(>])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<b>$1</b>')
  .replace(/(^|[\s(])\*(?!\s)([^*]+?)\*(?=[\s.,;:!?)]|$)/g, '$1<i>$2</i>').replace(/(^|[\s(])_(?!\s)([^_]+?)_(?=[\s.,;:!?)]|$)/g, '$1<i>$2</i>')
  .replace(/~~(.+?)~~/g, '<s>$1</s>')
  .replace(/(^|\s)#([A-Za-z][\w:-]*)/g, '$1<span class="tag">#$2</span>');
const mdHeading = s => {const m = String(s ?? '').match(/^(#{1,6})\s+(.*)$/); return m ? {level: m[1].length, text: m[2]} : {level: 0, text: String(s ?? '')};};
// one line of the outline (a title or a project name): leading hashes set the heading size
const mdLine = s => {const h = mdHeading(s); return {level: h.level, html: mdInline(h.text)};};
// a notes box: headings, bullets and checkboxes line by line, inline formatting throughout (pre-wrap keeps the lines)
const mdBlock = s => String(s ?? '').split('\n').map(line => {
  const h = mdHeading(line); if (h.level) return `<span class="md-h${h.level}">${mdInline(h.text)}</span>`;
  const b = line.match(/^(\s*)(?:[-*+•]|\d+[.)])\s+(?:\[([ xX])\]\s*)?(.*)$/);
  if (b) return `${b[1].replace(/ /g, '\u00a0')}${b[2] === undefined ? '•' : b[2] === ' ' ? '☐' : '☑'} ${mdInline(b[3])}`;
  return mdInline(line);
}).join('\n');
const linkify = mdBlock;
const fmtDate = ts => ts ? new Date(ts * 1000).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'}) : '';
const fmtDay = ts => ts ? new Date(ts * 1000).toLocaleDateString([], {dateStyle: 'medium'}) : '';
const hms = s => {const h = Math.floor(s / 3600), m = Math.floor(s % 60 / 1) && Math.floor((s % 3600) / 60), sec = s % 60; return (h ? h + ':' : '') + String(Math.floor((s % 3600) / 60)).padStart(2, '0') + ':' + String(sec).padStart(2, '0');};
let toastT; const toast = (m, ms = 3500) => {const t = $('#toast'); t.innerHTML = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', ms);};
const todayISO = () => {const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);};   // local date, not UTC
function deadlineChip(d) {
  if (!d) return '';
  const days = Math.round((new Date(d.slice(0, 10)) - new Date(todayISO())) / 86400000);
  const cls = days < 0 ? 'bad' : days <= 1 ? 'warn' : '';
  const label = days < 0 ? `overdue ${-days}d` : days === 0 ? 'due today' : days === 1 ? 'due tomorrow' : `due ${d.slice(0, 10)}`;
  return `<span class="chip ${cls}">${label}</span>`;
}
const impDots = n => n ? `<span class="dots" title="importance ${n}/5">${'●'.repeat(n)}${'○'.repeat(5 - n)}</span>` : '';

    try {
      const r = await api(`/tasks/${t.id}`, 'PATCH', body);
      const before = Object.fromEntries(Object.keys(body).map(k => [k, k === 'description' || k === 'blocking_for' ? (t[k] || '') : k === 'blocking' || k === 'chunkable' ? !!t[k] : k === 'deadline' ? (t.deadline || null) : t[k]]));
      pushUndo('edit', () => api(`/tasks/${t.id}`, 'PATCH', before));
      if (r.linear_error) toast('Saved; Linear: ' + esc(r.linear_error), 6000);
      close(); render();
    } catch (e) {toast(esc(e.message));}
    return false;
  };
  setTimeout(() => el.querySelector('[name=title]').focus(), 0);
}

// ------------------------------------------------------------------ plan timeline
async function renderPlan() {
  const p = await api('/plan');
  const m = $('#main');
  if (!p.items) {m.innerHTML = `<div class="card">No plan yet. <button class="btn primary" onclick="rebuild(false)">Build today's plan</button></div>`; return;}
  m.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">Plan for ${esc(p.date)} <span class="muted" style="font-weight:400;font-size:13px">${p.work_start}–${p.work_end} · exercise: ${esc(p.exercise)}</span></h3>
      <span class="row"><button class="btn small" onclick="rebuild(true)">Re-plan rest of day</button><button class="btn small" onclick="rebuild(false)">Rebuild</button></span></div>
    <p class="muted">${esc(p.rationale)}</p>
    <ul class="timeline" style="list-style:none;padding:0;margin:0">${p.items.map(i => `<li class="${i.status}"><span>${i.start}–${i.end}</span><span class="k">${i.kind}</span><span>${mdLine(i.title).html}${i.note ? ` <span class="muted">— ${esc(i.note)}</span>` : ''}</span>
      <span>${i.kind === 'meeting' ? '' : i.status === 'pending' ? `<button class="btn small ghost" onclick="skipItem(${i.id}).then(renderPlan)">skip</button>` : `<button class="btn small ghost" onclick="api('/feed/reset_item','POST',{item_id:${i.id}}).then(renderPlan)">reset</button>`}</span></li>`).join('')}</ul></div>`;
}

// ------------------------------------------------------------------ settings
// Everything the menu bar item and the files offer: API keys (Keychain), config.toml, the rules document.
async function renderSettings() {
  const s = await api('/settings'); const c = s.config, m = $('#main');
  const f = (sec, key, label, help, type) => {
    const v = c[sec]?.[key]; const id = `${sec}.${key}`;
    let input;
    if (type === 'bool') input = `<input type="checkbox" name="${id}" ${v ? 'checked' : ''}>`;
    else if (type === 'lines') input = `<textarea name="${id}" rows="3" style="min-height:60px">${esc((v || []).join('\n'))}</textarea>`;
    else if (Array.isArray(type)) input = `<select name="${id}">${type.map(o => `<option value="${o}" ${String(v) === String(o) ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    else input = `<input name="${id}" type="${type || 'text'}" value="${esc(Array.isArray(v) ? v.join(', ') : (v ?? ''))}">`;
    return `<label>${label}</label>${input}${help ? `<div class="help">${help}</div>` : ''}`;
  };
  const key = (name, label, placeholder, help) => `<label>${label}</label><div class="keyrow"><span class="chip ${s.secrets[name] ? 'ok' : 'warn'}" id="sec-${name}">${s.secrets[name] === 'env' ? 'set (environment)' : s.secrets[name] ? 'set' : 'not set'}</span>
      <input type="password" placeholder="${placeholder}" autocomplete="off" data-secret="${name}"><button class="btn small" onclick="saveSecret('${name}', this)">Save</button></div>${help ? `<div class="help">${help}</div>` : ''}`;
  const card = (title, status, body, intro) => `<div class="card"><h3>${title}${status === undefined ? '' : `<span class="chip ${status ? 'ok' : 'warn'}">${status ? 'on' : 'off'}</span>`}</h3>${intro ? `<p class="muted" style="margin:0 0 10px;font-size:13px">${intro}</p>` : ''}<div class="form">${body}</div></div>`;
  m.innerHTML = `<div class="settings">
    ${card('Claude', status.llm, key('anthropic', 'API key', 'sk-ant-…') + f('llm', 'enable', 'Use Claude', 'quick-add filing, estimates and the day plan; without it everything falls back to rules', 'bool') + f('llm', 'model', 'Model') + f('llm', 'effort', 'Plan effort', '', ['low', 'medium', 'high', 'max']) + f('llm', 'quick_add_effort', 'Quick-add effort', '', ['low', 'medium', 'high']))}
    ${card('Work day', undefined, f('general', 'work_start', 'Starts', '', 'time') + f('general', 'work_end', 'Ends', '', 'time') + f('general', 'default_estimate_minutes', 'Default estimate (min)', 'for a task that has no estimate yet', 'number') + f('general', 'min_block_minutes', 'Smallest block (min)', '', 'number') + f('general', 'replan_drift_minutes', 'Re-plan when late by (min)', 'the next block is this late or early', 'number') + f('general', 'overrun_minutes', 'Re-plan after overrun (min)', '', 'number') + f('general', 'replan_min_interval_minutes', 'Re-plan at most every (min)', '', 'number') + f('general', 'meeting_alert_minutes', 'Meeting reminder (min before)', 'the feed shows "meeting in N minutes" from this far out', 'number'))}
    ${card('Calendar', status.calendar, f('calendar', 'ics_urls', 'iCal feeds', 'one per line. Google Calendar → Settings → your calendar → "Secret address in iCal format"', 'lines') + f('calendar', 'ignore_titles', 'Ignore events titled', 'comma separated') + f('calendar', 'busy_only', 'Only busy events block time', '', 'bool'))}
    ${card('Toggl', status.toggl, key('toggl', 'API token', '32 hex characters', 'Toggl Track → Profile → API token') + f('toggl', 'tag', 'Tag on timers') + f('toggl', 'project', 'Toggl project', 'optional: file every entry under this Toggl project') + f('toggl', 'auto_project', 'Pick project and tags', 'a description you tracked before gets its last project and tags; otherwise Claude picks from your projects, or none when unsure', 'bool'))}
    ${card('Linear', status.linear, key('linear', 'API key', 'lin_api_…', 'Linear → Settings → API → personal API key') + f('linear', 'enable', 'Mirror my issues', '', 'bool') + f('linear', 'sync_minutes', 'Sync every (min)', '', 'number') + f('linear', 'category_name', 'Under project') + f('linear', 'group_by', 'Sub-project per', '', ['project', 'team']))}
    ${card('Checklist & exercise sheets', status.sheets !== 'none' && !!status.sheets, key('sheets', 'Sheet token', 'the SHEET_TOKEN script property', 'the Apps Script in apps_script/Code.gs, deployed as a web app on the checklist spreadsheet') + f('sheets', 'apps_script_url', 'Apps Script URL', 'the deployment\'s /exec URL: reads the checklist and checks items off') + f('sheets', 'exercise_script_url', 'Exercise log script URL', 'the exercise app\'s own Google Sheet sync URL (its /exec address); its logged sessions become the exercise history, read-only') + f('sheets', 'daily_checklist_csv', 'Checklist CSV URL', 'read-only fallback') + f('sheets', 'exercise_csv', 'Exercise CSV URL', 'read-only fallback') + f('sheets', 'cache_minutes', 'Cache (min)', '', 'number'))}
    <div class="card"><h3>Exercise</h3><p class="muted" style="margin:0 0 10px;font-size:13px">Your brief to Claude: what you do, how to pick today's session, rest days, and when in the day. Claude chooses the kind once each morning from this and your history; the length is learned from your Toggl entries of that kind (the app's exercise timers, plus any Toggl entry tagged "exercise").</p>
      <textarea id="exprompt" style="width:100%;min-height:200px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit">${esc(s.exercise_brief)}</textarea>
      <div class="form" style="margin-top:10px">${f('exercise', 'rotation', 'Rotation without Claude', 'comma separated: what the deterministic plan cycles through')}</div></div>
    ${card('Journal', undefined, f('journal', 'app', 'App', 'an app name, or a URL for Roam') + f('journal', 'desktop', 'Switch to desktop', 'Mission Control desktop number (needs its ctrl+N shortcut enabled); 0 = stay', 'number'))}
    ${card('Snapshots', undefined, f('snapshots', 'enable', 'Daily snapshot', '', 'bool') + f('snapshots', 'time', 'At', '', 'time') + f('snapshots', 'dir', 'Folder', `empty = ${esc(s.paths.snapshots)}`))}
    <div class="card"><h3>Scheduling rules &amp; heuristics</h3><p class="muted" style="margin:0 0 10px;font-size:13px">Free text that Claude reads when it builds the day. Say how you like your days shaped.</p>
      <textarea id="rules" style="width:100%;min-height:220px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit">${esc(s.rules)}</textarea></div>
    <div class="card"><h3>Files</h3><p class="muted" style="margin:0;font-size:13px">Settings: <code>${esc(s.paths.config)}</code><br>Data and snapshots: <code>${esc(s.paths.data)}</code><br>Rules: <code>${esc(s.paths.rules)}</code></p></div>
    <div class="savebar"><span class="muted" id="testout" style="flex:1;font-size:13px"></span><button class="btn" onclick="testIntegrations()">Test connections</button><button class="btn primary" onclick="saveSettings()">Save settings</button></div>
  </div>`;
}
async function saveSettings() {
  const cfg = {};
  document.querySelectorAll('.settings [name]').forEach(el => {
    const [sec, key] = el.name.split('.'); cfg[sec] = cfg[sec] || {};
    cfg[sec][key] = el.type === 'checkbox' ? el.checked : el.tagName === 'TEXTAREA' ? el.value.split('\n').map(x => x.trim()).filter(Boolean) : el.value;
  });
  try {await api('/settings', 'PUT', {config: cfg, rules: $('#rules').value, exercise_brief: $('#exprompt').value}); await refreshStatus(); toast('Settings saved'); renderSettings();}
  catch (e) {toast('Could not save: ' + esc(e.message), 6000);}
}
async function saveSecret(name, btn) {
  const inp = btn.parentElement.querySelector('input'); const value = inp.value.trim(); if (!value) {toast('Paste the key first'); return;}
  try {const r = await api('/settings/secret', 'POST', {name, value}); inp.value = ''; const chip = $('#sec-' + name); chip.textContent = 'set'; chip.className = 'chip ok'; await refreshStatus(); toast('Saved to your Keychain'); renderSettings();}
  catch (e) {toast('Could not save: ' + esc(e.message), 6000);}
}
async function testIntegrations() {
  const out = $('#testout'); out.textContent = 'Testing…';
  try {const r = await api('/settings/test', 'POST'); out.innerHTML = Object.entries(r).map(([k, v]) => `<b>${k}</b> ${esc(v)}`).join(' · ');}
  catch (e) {out.textContent = 'Test failed: ' + e.message;}
}

// ------------------------------------------------------------------ snapshots
// The daily Markdown files, newest first; the chosen one is rendered with the same Markdown as the notes boxes.
let snapDate = null;
async function renderSnapshots() {
  const s = await api('/snapshots');
  const m = $('#main');
  if (!s.items.length) {
    m.innerHTML = `<div class="card"><h3 style="margin-top:0">Snapshots</h3><p class="muted">No snapshots yet. One is written every day at 05:00 into <code>${esc(s.dir)}</code>.</p>
      <button class="btn primary" onclick="snapshotNow()">Snapshot now</button></div>`;
    return;
  }
  if (!s.items.some(i => i.date === snapDate)) snapDate = s.items[0].date;
  const snap = await api(`/snapshots/${snapDate}`);
  m.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Snapshots <span class="muted" style="font-weight:400;font-size:13px">${s.items.length} day${s.items.length === 1 ? '' : 's'} · ${esc(s.dir)}</span></h3>
      <button class="btn small" onclick="snapshotNow()">Snapshot now</button></div>
    <div class="snaps">
      <div class="dates">${s.items.map(i => `<button class="${i.date === snapDate ? 'on' : ''}" onclick="snapDate='${i.date}';renderSnapshots()">${i.date}</button>`).join('')}</div>
      <div class="snap">${mdBlock(snap.text)}</div>
    </div></div>`;
}
async function snapshotNow() {const r = await api('/snapshot', 'POST'); toast('Snapshot written: ' + esc(r.path), 5000); snapDate = r.path.slice(-13, -3); if (view === 'snapshots') renderSnapshots();}

// ------------------------------------------------------------------ stats
async function renderStats() {
  const s = await api('/stats/estimates');
  $('#main').innerHTML = `<div class="card"><h3 style="margin-top:0">Estimate calibration</h3>
    <p>Across <b>${s.samples}</b> completed tasks with estimates and tracked time, tasks take <b>${s.overall}×</b> their estimate (median). ${s.samples < 5 ? '<span class="muted">Fewer than 5 samples: the scheduler is still using raw estimates.</span>' : 'The scheduler multiplies estimates by this.'}</p>
    ${Object.keys(s.by_root_project).length ? `<p class="muted">Per top-level project: ${Object.entries(s.by_root_project).map(([k, v]) => `#${k}: ${v}×`).join(', ')}</p>` : ''}
    ${s.recent.length ? `<table><tr><th>Task</th><th>Estimate</th><th>Actual</th></tr>${s.recent.map(r => `<tr><td>${mdLine(r.title).html}</td><td>${r.estimate} min</td><td>${r.actual} min</td></tr>`).join('')}</table>` : ''}
    <h3>Integrations</h3>
    <table>${[['Claude (quick add, scheduling)', status.llm], ['Toggl', status.toggl], ['Linear', status.linear], ['Calendar feeds', status.calendar], ['Checklist / exercise sheets', status.sheets !== 'none' ? status.sheets : false], ['Sheet write-back', status.sheets_writable]].map(([k, v]) => `<tr><td>${k}</td><td>${v ? '<span class="chip ok">on</span>' : '<span class="chip warn">off</span>'}</td></tr>`).join('')}</table>
    <p class="muted"><a href="#plan" onclick="go('plan');return false">Inspect today's internal schedule</a> (debugging only; the feed is the normal interface).</p>
    <p class="muted">Work day ${status.work_start}–${status.work_end}. Keys, feeds and the rules document are on the <a href="#settings" onclick="go('settings');return false">Settings</a> page.</p></div>`;
}

refreshStatus().then(render);
window.addEventListener('hashchange', () => {const v = location.hash.slice(1); if (v && v !== view) {view = v; render();}});
setInterval(() => {if (view === 'feed' && !document.querySelector('.modal')) renderFeed().catch(() => {});}, 60000);
</script>

# A read-only COPY of the Project Tracker beside the executive-assistant agent, so the agent can read tasks while
# Eli's Mac (where the real tracker runs) is asleep. The agent reaches it on the shared Docker network
# (http://tracker:8791). The copy is refreshed from the Mac by the agent project's sync-tracker-copy.sh. There is
# no login on the tracker's API, so the port is bound to the machine itself and not offered to the tailnet.
services:
  tracker:
    build:
      context: ../..
      dockerfile: deploy/tailnet/Dockerfile
    image: project-tracker
    container_name: tracker
    restart: unless-stopped
    init: true
    environment:
      TASK_TRACKER_HOST: 0.0.0.0
      TASK_TRACKER_REPLICA: "1"                    # refuses writes, runs no background loop; no API keys are given to it
      TASK_TRACKER_DATA: /data                     # tracker.sqlite3, config.toml and the two documents, copied from the Mac
      TASK_TRACKER_CONFIG: /data/config.toml
      AGENT_CODING_SHARED: /app/shared
      TZ: ${TRACKER_TZ:-America/Los_Angeles}       # every time in the tracker is this zone's local time
      HOME: /home/tracker
    volumes:
      - ${TRACKER_ROOT:-/opt/tracker}/app:/app:ro
      - ${TRACKER_ROOT:-/opt/tracker}/data:/data
      - ${TRACKER_ROOT:-/opt/tracker}/logs:/home/tracker/Library/Logs
      # Only the LLM inbox is shared with the agent, so a message from Claude to Eli is relayed to the Mac with the rest.
      - ${ATLAS_INBOX:-/opt/atlas/data/home/Library/Application Support/LLMInbox}:/home/tracker/Library/Application Support/LLMInbox
    ports:
      - "127.0.0.1:8791:8791"
    networks: [atlas]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  atlas:
    name: ${ATLAS_NETWORK:-deploy_default}
    external: true
